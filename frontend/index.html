<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evergreen | Quote Generator</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <header>
            <div class="logo">✦ Evergreen</div>
            <span class="tagline">A little inspiration every day</span>
        </header>

        <main>

            <section class="quote-section">

                <div class="section-label">✧ YOUR DAILY INSPIRATION</div>

                <div class="quote-card">

                    <div class="quote-icon">“</div>

                    <p id="quote">
                        Your next favorite quote is just one click away.
                    </p>

                    <h3 id="author">— Evergreen</h3>

                    <button id="newQuoteBtn">
                        <span>✦</span> Generate New Quote
                    </button>

                </div>

                <div class="quote-footer">
                    <span>✧ Words that inspire. Moments that matter.</span>
                </div>

            </section>


            <section class="history-section">

                <div class="history-heading">
                    <div>
                        <span class="section-label">YOUR COLLECTION</span>
                        <h2>Quote History</h2>
                    </div>

                    <span class="history-icon">◷</span>
                </div>

                <div id="history" class="history-list">
                    <p class="empty-message">Your saved quotes will appear here.</p>
                </div>

            </section>

        </main>

        <footer>
            Made with ♡ and a little inspiration.
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
